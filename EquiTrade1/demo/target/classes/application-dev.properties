# ──────────────────────────────────────────────────────────────────────────────
# Dev-profile overrides — NEVER commit real secrets here; use env vars in prod.
# This file is active when spring.profiles.active=dev (or spring.profiles.default=dev).
# ──────────────────────────────────────────────────────────────────────────────

# Local JWT secret (≥ 32 bytes, random, for development only)
JWT_SECRET=EquiTradeDev-LocalOnly-SecretKey-DoNotUseInProd-2026XYZ!

# Override the property binding so JwtUtils picks it up without the env var
jwt.secret=${JWT_SECRET:EquiTradeDev-LocalOnly-SecretKey-DoNotUseInProd-2026XYZ!}

# Dev only: shorter expiry for quicker iteration (30 minutes)
jwt.expiration.ms=1800000

# H2 console enabled in dev
spring.h2.console.enabled=true
