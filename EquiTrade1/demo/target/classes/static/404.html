<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | EquiTrade</title>
    <meta name="description" content="The security or page you are looking for does not exist on EquiTrade." />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/components.js" defer></script>
  </head>
  <body data-page="404">
    <main class="page-shell">
      <div class="container" style="max-width: 580px; margin: 60px auto 0; text-align: center;">
        <div class="panel" style="padding: var(--space-8) var(--space-6);">
          <div class="stock-chip negative" style="margin-bottom: var(--space-3); font-size: var(--font-size-xs);">
            404 Not Found
          </div>
          <h1 style="font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); letter-spacing: -0.02em; margin-bottom: var(--space-2);">
            Position or route not found.
          </h1>
          <p style="color: var(--color-slate); font-size: var(--font-size-sm); line-height: var(--line-height-normal); margin-bottom: var(--space-6);">
            The security or route you requested might have been de-listed or moved in today's trading session.
          </p>
          <div style="display: flex; justify-content: center; gap: var(--space-3); flex-wrap: wrap;">
            <a class="btn btn-primary" href="index.html">Return to Dashboard</a>
            <a class="btn btn-secondary" href="market.html">Explore Markets</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
