server.port=8081

spring.datasource.url=jdbc:h2:mem:equitrade;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.sql.init.mode=never

# Mail Configuration (Credentials configurable via environment variables)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:admin@equitrade.com}
spring.mail.password=${MAIL_PASSWORD:secret}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000

admin.notify.email=admin@equitrade.com
app.base-url=http://localhost:8081

# Profile Configuration
spring.profiles.default=dev

# CORS Configuration
app.cors.allowed-origins=http://localhost:8081,http://127.0.0.1:5500

# JWT Configuration (Read strictly from JWT_SECRET env var; local dev secret provided via dev profile)
jwt.secret=${JWT_SECRET:}
jwt.expiration.ms=${JWT_EXPIRATION_MS:3600000}

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.hibernate.SQL=WARN