<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trade Order History | EquiTrade</title>
    <meta name="description" content="Audit journal of all executed practice buy and sell market orders with CSV export." />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/components.js" defer></script>
  </head>
  <body data-page="history">
    <main class="page-shell">
      <div class="container">
        
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-4); flex-wrap: wrap; gap: var(--space-3);">
          <div>
            <h1 style="font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); letter-spacing: -0.02em;">Order History</h1>
            <div style="font-size: var(--font-size-sm); color: var(--color-slate); margin-top: 2px;">
              Chronological audit log of all executed buy and sell simulated trades.
            </div>
          </div>
          <button type="button" class="btn btn-secondary btn-sm" id="exportCsvBtn">
            Export CSV Journal
          </button>
        </div>

        <!-- Filter Toolbar -->
        <div class="panel" style="padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4);">
          <div style="display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap;">
            <!-- Type Filter -->
            <div style="flex: 1; min-width: 140px;">
              <select id="typeFilter" class="select-input">
                <option value="all">All Actions (Buy & Sell)</option>
                <option value="BUY">Buy Orders Only</option>
                <option value="SELL">Sell Orders Only</option>
              </select>
            </div>

            <!-- Status Filter -->
            <div style="flex: 1; min-width: 140px;">
              <select id="statusFilter" class="select-input">
                <option value="all">All Statuses</option>
                <option value="EXECUTED">Executed</option>
              </select>
            </div>

            <!-- Search by Symbol / Name -->
            <div style="flex: 2; min-width: 200px;">
              <input type="text" id="historySearch" class="text-input" placeholder="Filter by symbol or company..." />
            </div>

            <button type="button" id="resetHistoryBtn" class="btn btn-ghost btn-sm">Reset</button>
          </div>
        </div>

        <!-- Orders Table -->
        <div class="table-panel">
          <div class="table-wrap">
            <table class="trading-table dense" id="historyTable">
              <thead>
                <tr>
                  <th class="text-left">Order ID</th>
                  <th class="text-left">Type</th>
                  <th class="text-left">Security</th>
                  <th class="text-right">Shares</th>
                  <th class="text-right">Execution Price</th>
                  <th class="text-right">Total Value</th>
                  <th class="text-center">Status</th>
                  <th class="text-right">Executed At</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr><td colspan="8"><div class="skeleton" style="height: 32px; margin: 4px 0;"></div></td></tr>
                <tr><td colspan="8"><div class="skeleton" style="height: 32px; margin: 4px 0;"></div></td></tr>
                <tr><td colspan="8"><div class="skeleton" style="height: 32px; margin: 4px 0;"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>

    <script>
      let fullOrdersList = [];

      document.addEventListener('DOMContentLoaded', async () => {
        if (redirectToLoginIfNeeded()) return;
        setupFilterEvents();
        await loadOrderHistory();
      });

      async function loadOrderHistory() {
        try {
          const data = await apiGet('/api/trade/history');
          fullOrdersList = Array.isArray(data) ? data : [];
          renderOrdersTable();
        } catch (error) {
          showToast(error.message || 'Unable to load trade history.', 'error');
        }
      }

      function renderOrdersTable() {
        const typeFilter = document.getElementById('typeFilter').value;
        const query = (document.getElementById('historySearch').value || '').trim().toLowerCase();
        const tbody = document.getElementById('historyTableBody');

        const filtered = fullOrdersList.filter(item => {
          const matchesType = typeFilter === 'all' || item.type === typeFilter;
          const sym = (item.stockSymbol || '').toLowerCase();
          const comp = (item.companyName || '').toLowerCase();
          const matchesQuery = !query || sym.includes(query) || comp.includes(query);
          return matchesType && matchesQuery;
        });

        if (!filtered.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="8" class="text-center" style="padding: 48px;">
                <div class="empty-state-title">No Orders Recorded</div>
                <div class="empty-state-text">No transaction history matching your filters. Open Markets to place your first trade.</div>
                <a href="market.html" class="btn btn-primary btn-sm">Open Markets</a>
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = filtered.map(order => {
          const isBuy = (order.type || '').toUpperCase() === 'BUY';
          const totalVal = order.totalPrice || (order.quantity * order.price);
          const dateStr = order.createdAt ? new Date(order.createdAt).toLocaleString('en-IN', {
            dateStyle: 'medium',
            timeStyle: 'short'
          }) : 'Just now';

          return `
            <tr>
              <td class="text-left" style="color: var(--color-slate); font-family: monospace; font-size: var(--font-size-xs);">
                #ORD-${order.id || Math.floor(Math.random() * 90000 + 10000)}
              </td>
              <td class="text-left">
                <span class="stock-chip ${isBuy ? 'positive' : 'negative'}" style="font-size: 0.7rem; padding: 1px 6px;">
                  ${order.type}
                </span>
              </td>
              <td class="text-left">
                <a href="stock.html?symbol=${encodeURIComponent(order.stockSymbol)}" style="font-weight: var(--font-weight-bold); color: var(--color-ink);">
                  ${order.stockSymbol}
                </a>
                <span style="font-size: var(--font-size-xs); color: var(--color-slate); margin-left: 6px;">${order.companyName || ''}</span>
              </td>
              <td class="text-right num" style="font-weight: var(--font-weight-semibold);">${order.quantity}</td>
              <td class="text-right num">${formatCurrency(order.price)}</td>
              <td class="text-right num" style="font-weight: var(--font-weight-bold);">${formatCurrency(totalVal)}</td>
              <td class="text-center">
                <span class="stock-chip positive" style="font-size: 0.68rem; padding: 1px 6px;">Executed</span>
              </td>
              <td class="text-right" style="color: var(--color-slate); font-size: var(--font-size-xs);">${dateStr}</td>
            </tr>
          `;
        }).join('');
      }

      function setupFilterEvents() {
        document.getElementById('typeFilter').addEventListener('change', renderOrdersTable);
        document.getElementById('statusFilter').addEventListener('change', renderOrdersTable);
        document.getElementById('historySearch').addEventListener('input', renderOrdersTable);

        document.getElementById('resetHistoryBtn').addEventListener('click', () => {
          document.getElementById('typeFilter').value = 'all';
          document.getElementById('statusFilter').value = 'all';
          document.getElementById('historySearch').value = '';
          renderOrdersTable();
        });

        // CSV Export
        document.getElementById('exportCsvBtn').addEventListener('click', () => {
          if (!fullOrdersList.length) {
            showToast('No orders available to export.', 'info');
            return;
          }

          const headers = ['Order ID', 'Type', 'Symbol', 'Company', 'Shares', 'Price (INR)', 'Total Value (INR)', 'Executed At'];
          const rows = fullOrdersList.map(o => [
            `ORD-${o.id}`,
            o.type,
            o.stockSymbol,
            `"${(o.companyName || '').replace(/"/g, '""')}"`,
            o.quantity,
            o.price,
            o.totalPrice || (o.quantity * o.price),
            `"${o.createdAt || new Date().toISOString()}"`
          ]);

          const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement('a');
          link.setAttribute('href', encodedUri);
          link.setAttribute('download', `equitrade_orders_${new Date().toISOString().slice(0, 10)}.csv`);
          document.body.appendChild(link);
          link.click();
          link.remove();
          showToast('Order journal exported to CSV.', 'success');
        });
      }
    </script>
  </body>
</html>
