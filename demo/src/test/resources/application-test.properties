# Test profile — provides a fixed JWT secret so JwtUtils @PostConstruct succeeds
jwt.secret=TestOnlySecretKeyForJUnitDoNotUseInProd1234
jwt.expiration.ms=3600000

# Use in-memory H2
spring.datasource.url=jdbc:h2:mem:equitrade-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let JPA create the schema from entity metadata; suppress data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# CRITICAL: suppress data.sql so it doesn't run before JPA creates the tables
spring.sql.init.mode=never

# Disable mail for tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

# Suppress multipart limits warning in tests
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
