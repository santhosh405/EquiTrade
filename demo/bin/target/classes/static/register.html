<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | EquiTrade</title>
    <meta name="description" content="Create a new EquiTrade virtual trading account and get ₹1,00,000 in simulated demo balance." />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/components.js" defer></script>
  </head>
  <body data-page="register">
    <main class="page-shell">
      <div class="container" style="max-width: 520px; margin: 40px auto 0;">
        <div class="panel-card glass" style="padding: 36px 32px;">
          <div style="text-align:center; margin-bottom: 24px;">
            <a href="index.html" class="brand" style="justify-content:center; margin-bottom: 16px;">
              <svg width="38" height="38" viewBox="0 0 64 64" fill="none">
                <rect width="64" height="64" rx="16" fill="url(#regBrandGrad)"/>
                <path d="M18 38 L28 26 L36 34 L46 20" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="46" cy="20" r="4.5" fill="#ffffff"/>
                <defs>
                  <linearGradient id="regBrandGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#4F7CFF"/>
                    <stop offset="1" stop-color="#8B5CF6"/>
                  </linearGradient>
                </defs>
              </svg>
              <span>EquiTrade</span>
            </a>
            <h2 style="margin: 0; font-size: 1.6rem;">Create Your Account</h2>
            <p style="color: var(--muted); margin-top: 6px; font-size: 0.92rem;">
              Sign up today and receive <strong style="color:var(--success);">₹1,00,000</strong> in virtual trading funds.
            </p>
          </div>

          <form id="registerForm" class="form-card">
            <div class="form-group">
              <label for="registerUsername">Username</label>
              <input id="registerUsername" class="text-input" type="text" placeholder="e.g. virat_trader" required autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="registerEmail">Email Address</label>
              <input id="registerEmail" class="text-input" type="email" placeholder="name@example.com" required autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="registerPassword">Password</label>
              <input id="registerPassword" class="text-input" type="password" placeholder="At least 6 characters" required autocomplete="new-password" />
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <input id="confirmPassword" class="text-input" type="password" placeholder="Re-enter password" required autocomplete="new-password" />
            </div>
            <button class="btn btn-primary" type="submit" id="regSubmitBtn" style="width: 100%; margin-top: 8px;">
              Create Free Account
            </button>
            <div style="text-align:center; color: var(--muted); font-size: 0.9rem; margin-top: 14px;">
              Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Sign in</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script>
      document.getElementById('registerForm')?.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('registerUsername').value.trim();
        const email = document.getElementById('registerEmail').value.trim();
        const password = document.getElementById('registerPassword').value.trim();
        const confirmPass = document.getElementById('confirmPassword').value.trim();
        const submitBtn = document.getElementById('regSubmitBtn');

        if (!username || !email || !password) {
          showToast('Please complete all required fields.', 'error');
          return;
        }

        if (password.length < 6) {
          showToast('Password must be at least 6 characters.', 'error');
          return;
        }

        if (password !== confirmPass) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account...';
          showPageLoader();

          const response = await registerUser(username, email, password);
          showToast(response.message || 'Registration successful! Please login.', 'success');

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1000);
        } catch (error) {
          showToast(error.message || 'Registration failed.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Free Account';
          hidePageLoader();
        }
      });
    </script>
  </body>
</html>
